---
# Cluster-scoped permissions: CRD discovery + watch CRs cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openstack-operator
  labels:
    app.kubernetes.io/name: openstack-operator
rules:
  # OpenstackProject CRD access (namespaced — read/patch only at cluster scope)
  - apiGroups: ["sunet.se"]
    resources: ["openstackprojects"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["sunet.se"]
    resources: ["openstackprojects/status"]
    verbs: ["get", "patch", "update"]
  # Cluster-scoped CRD access (domains, flavors, images, networks)
  - apiGroups: ["sunet.se"]
    resources: ["openstackarchivepolicies", "openstackdomains", "openstackflavors", "openstackimages", "openstacknetworks"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["sunet.se"]
    resources: ["openstackarchivepolicies/status", "openstackdomains/status", "openstackflavors/status", "openstackimages/status", "openstacknetworks/status"]
    verbs: ["get", "patch", "update"]
  # Required for Kopf to discover CRDs
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Federation ConfigMap reads happen cluster-wide (the CR points at any
  # namespace), but writes are restricted to the operator's own namespace
  # via the namespaced Role below.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openstack-operator
  labels:
    app.kubernetes.io/name: openstack-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openstack-operator
subjects:
  - kind: ServiceAccount
    name: openstack-operator
    namespace: openstack-operator
---
# Namespace-scoped permissions: ConfigMap mutations (managed-resource
# registry + finalizer-supporting events + leader-election leases) are
# confined to the operator's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openstack-operator
  namespace: openstack-operator
  labels:
    app.kubernetes.io/name: openstack-operator
rules:
  # Kopf finalizers/events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Resource registry ConfigMap (`openstack-operator-resources` and
  # `federation-config` live here by default).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update", "patch"]
  # Leader election leases
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openstack-operator
  namespace: openstack-operator
  labels:
    app.kubernetes.io/name: openstack-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openstack-operator
subjects:
  - kind: ServiceAccount
    name: openstack-operator
    namespace: openstack-operator
