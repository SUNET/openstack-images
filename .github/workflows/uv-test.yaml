name: Test customer cluster operator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  customer-cluster-operator-tests:
    name: python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: customer-cluster-operator

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version-file: "customer-cluster-operator/pyproject.toml"
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest tests
      - name: Run linter
        run: uv run ruff check
