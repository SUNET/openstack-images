---
# OpenStack custom images for SUNET Platform
clean_workspace: true
triggers:
  cron: "@daily"

environment_variables:
  OPERATOR_VERSION: "0.1.1"

extra_jobs:
  # Keystone with OIDC support
  - name: openstack-keystone
    builders:
      - docker
    docker_name: platform/openstack-keystone
    docker_context_dir: keystone
    docker_tags:
      - "2025.2-ubuntu_noble-2"
      - "latest"

  # OpenStack Operator (Kopf-based K8s operator)
  - name: openstack-operator
    builders:
      - docker
    docker_name: platform/openstack-operator
    docker_context_dir: openstack-operator
    docker_no_cache: true
    docker_tags:
      - "${OPERATOR_VERSION}"
      - "latest"

  # Customer self-service portal
  - name: customer-portal
    builders:
      - docker
    docker_name: platform/customer-portal
    docker_context_dir: customer-portal
    docker_no_cache: true
    docker_tags:
      - "0.1.0"
      - "latest"

  # Libvirt with QEMU SPICE support
  - name: openstack-libvirt
    builders:
      - docker
    docker_name: platform/openstack-libvirt
    docker_context_dir: libvirt
    docker_tags:
      - "2025.2-ubuntu_noble-1"
      - "latest"

  # Runner for the monitoring end-to-end tests (OpenStack client + kubectl)
  - name: monitoring-e2e
    builders:
      - docker
    docker_name: platform/monitoring-e2e
    docker_context_dir: monitoring-e2e
    docker_tags:
      - "0.1.0"
      - "latest"
