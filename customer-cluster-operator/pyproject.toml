[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "customer-cluster-operator"
version = "0.1.5"
description = "Kopf operator provisioning ManagedCluster infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kopf==1.38.0",
    "kubernetes==33.1.0",
    "openstacksdk==4.7.1",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==6.2.1",
    "ruff==0.12.11",
]

[project.scripts]
customer-cluster-operator = "customer_cluster_operator.controller:main"
customer-cluster-worker = "customer_cluster_operator.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_cluster_operator"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
